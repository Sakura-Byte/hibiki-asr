name: Binary and Docker CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64-cpu
            variant: cpu
          - os: windows-latest
            target: windows-x64-cpu
            variant: cpu
          - os: macos-latest
            target: macos-arm64-mlx
            variant: mlx
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            src/hibiki_asr/provision/lockfiles/${{ matrix.variant }}.txt
      - name: Install pinned standalone runtime
        run: |
          uv venv
          uv pip install --require-hashes --no-deps -r src/hibiki_asr/provision/lockfiles/${{ matrix.variant }}.txt
          uv pip install .
          uv pip install 'pyinstaller==6.22.3'
      - run: uv run --no-sync pyinstaller --noconfirm scripts/hibiki-asr.spec
      - name: Test frozen probe, spawned worker and HTTP server
        run: uv run --no-sync python scripts/smoke_binary.py dist/hibiki-asr/hibiki-asr${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Archive executable and its bundled libraries
        run: |
          printf '{"commit":"%s","runtime":"%s"}\n' '${{ github.sha }}' '${{ matrix.variant }}' > dist/hibiki-asr/provenance.json
          tar -czf hibiki-asr-${{ matrix.target }}.tar.gz -C dist hibiki-asr
          python -c "import hashlib,pathlib; p=pathlib.Path('hibiki-asr-${{ matrix.target }}.tar.gz'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v7
        with:
          name: hibiki-asr-${{ matrix.target }}
          path: hibiki-asr-${{ matrix.target }}.tar.gz*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
  docker:
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda, rocm]
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for GPU image layers and private archives
        if: matrix.variant != 'cpu'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.${{ matrix.variant }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          load: true
          tags: hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }}
          cache-from: type=gha,scope=asr-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=asr-${{ matrix.variant }},ignore-error=true,timeout=3m
      - name: The engine refuses to start without a token
        run: |
          if docker run --rm hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }}; then
            echo "the container started without HIBIKI_ASR_TOKEN" >&2
            exit 1
          fi
      - name: The engine becomes healthy
        run: |
          docker run -d --name engine -e HIBIKI_ASR_TOKEN=ci -p 8001:8001 hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }}
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/v1/healthz; then exit 0; fi
            sleep 2
          done
          docker logs engine
          exit 1
      - name: What the engine sees
        run: docker exec engine hibiki-asr doctor
      # The pinned decoder (PyAV) and faster-whisper must agree: a mismatch fails every job, and nothing else here
      # would notice.
      - name: The pinned runtime decodes audio
        run: |
          docker exec engine python -c "
          import wave, numpy as np
          from faster_whisper.audio import decode_audio
          with wave.open('/tmp/tone.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000)
              w.writeframes((np.sin(np.arange(8000) / 5) * 8000).astype(np.int16).tobytes())
          audio = decode_audio('/tmp/tone.wav', sampling_rate=16000)
          assert audio.shape == (16000,) and abs(audio).max() > 0.1, audio.shape
          print('decoded', audio.shape)
          "
      - name: Save image archive
        if: github.event_name != 'pull_request'
        run: |
          if ! command -v pigz >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pigz
          fi
          docker save hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }} | pigz -1 > hibiki-asr-${{ matrix.variant }}.docker.tar.gz
          sha256sum hibiki-asr-${{ matrix.variant }}.docker.tar.gz > hibiki-asr-${{ matrix.variant }}.docker.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: hibiki-asr-docker-${{ matrix.variant }}
          path: hibiki-asr-${{ matrix.variant }}.docker.tar.gz*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  publish:
    name: Publish validated public delivery
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, binary, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare disk and download completed artifacts sequentially
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          mkdir -p release
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name | select(startswith("hibiki-asr-"))' | while read -r artifact; do
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$artifact" -D release
          done
      - name: Split large Docker archives for GitHub Release size limits
        working-directory: release
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in Path('.').glob('*.docker.tar.gz'):
              if path.stat().st_size <= 1_900_000_000:
                  continue
              with path.open('rb') as source:
                  index = 0
                  while chunk := source.read(1024 * 1024 * 1024):
                      part = Path(str(path) + f'.part-{index:03}')
                      part.write_bytes(chunk)
                      index += 1
              path.unlink()
              Path(str(path) + '.sha256').unlink()
          with Path('SHA256SUMS').open('w') as output:
              for path in sorted(Path('.').iterdir()):
                  if path.name == 'SHA256SUMS' or path.suffix == '.sha256':
                      continue
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  output.write(digest + '  ' + path.name + '\n')
          PY
      - name: Publish immutable commit-qualified release
        working-directory: release
        run: |
          printf 'Validated standalone binaries and CPU/CUDA/ROCm Docker archives for commit %s. Verify SHA256SUMS before use. For split images, concatenate the numbered parts before loading the gzip archive with docker load.\n' "$GITHUB_SHA" > ../release-notes.md
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets are retained."
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CI $GITHUB_SHA" --prerelease --notes-file ../release-notes.md ./*
          fi

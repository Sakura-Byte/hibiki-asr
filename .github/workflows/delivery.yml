name: Binary and Docker CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64-cpu
            variant: cpu
          - os: windows-latest
            target: windows-x64-cpu
            variant: cpu
          - os: macos-latest
            target: macos-arm64-mlx
            variant: mlx
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sakura-Byte/hibiki-asr
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install pinned standalone runtime
        run: |
          uv venv
          uv pip install --require-hashes --no-deps -r src/hibiki_asr/provision/lockfiles/${{ matrix.variant }}.txt
          uv pip install .
          uv pip install 'pyinstaller==6.22.3'
      - run: uv run --no-sync pyinstaller --noconfirm scripts/hibiki-asr.spec
      - name: Test frozen probe, spawned worker and HTTP server
        run: uv run --no-sync python scripts/smoke_binary.py dist/hibiki-asr/hibiki-asr${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Archive executable and its bundled libraries
        run: |
          printf '{"commit":"%s","runtime":"%s"}\n' '${{ github.sha }}' '${{ matrix.variant }}' > dist/hibiki-asr/provenance.json
          tar -czf hibiki-asr-${{ matrix.target }}.tar.gz -C dist hibiki-asr
          python -c "import hashlib,pathlib; p=pathlib.Path('hibiki-asr-${{ matrix.target }}.tar.gz'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v7
        with:
          name: hibiki-asr-${{ matrix.target }}
          path: hibiki-asr-${{ matrix.target }}.tar.gz*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
  docker:
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda, rocm]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sakura-Byte/hibiki-asr
          ref: ${{ github.sha }}
      - name: Reserve disk for GPU image layers and private archives
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          load: true
          tags: hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }}
      - name: Smoke test image
        run: |
          docker run -d --name engine -e HIBIKI_ASR_TOKEN=ci -p 8001:8001 hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }}
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/v1/healthz; then exit 0; fi
            sleep 2
          done
          docker logs engine
          exit 1
      - name: Save image archive
        run: |
          docker save hibiki-asr:ci-${{ github.sha }}-${{ matrix.variant }} | gzip > hibiki-asr-${{ matrix.variant }}.docker.tar.gz
          sha256sum hibiki-asr-${{ matrix.variant }}.docker.tar.gz > hibiki-asr-${{ matrix.variant }}.docker.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: hibiki-asr-docker-${{ matrix.variant }}
          path: hibiki-asr-${{ matrix.variant }}.docker.tar.gz*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  publish:
    name: Publish validated public delivery
    needs: [binary, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the independent test CI to pass
        run: |
          for attempt in $(seq 1 120); do
            conclusion=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml --commit "$GITHUB_SHA" -L 1 --json status,conclusion --jq '.[0].conclusion // ""')
            if [ "$conclusion" = success ]; then exit 0; fi
            if [ -n "$conclusion" ]; then echo "Upstream tests: $conclusion"; exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for test CI"; exit 1
      - uses: actions/download-artifact@v8
        with:
          pattern: hibiki-asr-*
          path: release
          merge-multiple: true
      - name: Split large Docker archives for GitHub Release size limits
        working-directory: release
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in Path('.').glob('*.docker.tar.gz'):
              if path.stat().st_size <= 1_900_000_000:
                  continue
              with path.open('rb') as source:
                  index = 0
                  while chunk := source.read(1024 * 1024 * 1024):
                      part = Path(str(path) + f'.part-{index:03}')
                      part.write_bytes(chunk)
                      index += 1
              path.unlink()
              Path(str(path) + '.sha256').unlink()
          with Path('SHA256SUMS').open('w') as output:
              for path in sorted(Path('.').iterdir()):
                  if path.name == 'SHA256SUMS' or path.suffix == '.sha256':
                      continue
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  output.write(digest + '  ' + path.name + '\n')
          PY
      - name: Publish immutable commit-qualified release
        working-directory: release
        run: |
          printf 'Validated standalone binaries and CPU/CUDA/ROCm Docker archives for commit %s. Verify SHA256SUMS before use. For split images, concatenate the numbered parts before loading the gzip archive with docker load.\n' "$GITHUB_SHA" > ../release-notes.md
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets are retained."
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CI $GITHUB_SHA" --prerelease --notes-file ../release-notes.md ./*
          fi

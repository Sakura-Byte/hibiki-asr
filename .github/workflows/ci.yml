name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          # Apple Silicon. The runner's GPU is not usable, so MLX itself is exercised by hand (see the README).
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[runtime,dev]"
      - name: ruff
        run: uv run --no-sync ruff check .
      # Python 3.10 caps numpy at 2.2, whose stubs want explicit type arguments for ndarray: mypy reports 21
      # annotation errors there that 3.11+ does not, so the types are checked on the current Python only.
      - name: mypy
        if: matrix.python == '3.12'
        run: uv run --no-sync mypy
      - name: pytest
        run: uv run --no-sync pytest -q

  openapi:
    name: openapi.json is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[runtime]"
      - name: Regenerate openapi.json
        run: uv run --no-sync python scripts/export_openapi.py
      - name: Fail if it changed
        run: git diff --exit-code -- openapi.json

  scripts:
    name: install script and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh
      - name: docker compose config
        run: |
          for profile in cpu cuda rocm; do
            HIBIKI_ASR_TOKEN=ci docker compose -f docker/compose.example.yml --profile "$profile" config --quiet
          done

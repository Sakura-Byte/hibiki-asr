name: Release

# Push a tag such as v0.2.0 to publish: the sdist and wheel on a GitHub release, and the Docker images
# ghcr.io/sakura-byte/hibiki-asr:<version>-{cpu,cuda,rocm} plus latest-{cpu,cuda,rocm}.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/sakura-byte/hibiki-asr

jobs:
  dist:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: image ${{ matrix.tag }}
    runs-on: ubuntu-latest
    # The ROCm image is experimental: its failure must not fail the release.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU image is also built for arm64 (Apple silicon, Ampere, Raspberry Pi 5); the GPU ones are not.
          - tag: cpu
            dockerfile: docker/Dockerfile.cpu
            experimental: false
            platforms: linux/amd64,linux/arm64
            build_args: ""
          - tag: cuda
            dockerfile: docker/Dockerfile.cuda
            experimental: false
            platforms: linux/amd64
            build_args: ""
          # The official ROCm archive is pinned and hash-checked by setup. GPU inference remains experimental.
          - tag: rocm
            dockerfile: docker/Dockerfile.rocm
            experimental: true
            platforms: linux/amd64
            build_args: |
              ROCM_IMAGE=${{ vars.ROCM_IMAGE || 'rocm/dev-ubuntu-22.04:7.2.4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.tag }}
            type=raw,value=latest-${{ matrix.tag }},enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

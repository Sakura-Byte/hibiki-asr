[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hibiki-asr"
version = "0.1.0"
description = "Local Whisper (CTranslate2) ASR engine service for Hibiki/KikoeruGo: CPU/CUDA/ROCm auto-detection, cancellable job API, model and version management."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Sakura-Byte" }]

# The API process only needs these. It never imports the inference stack, so
# `doctor`, `/v1/diagnostics` and model management keep working even when the
# GPU runtime is missing or broken.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Inference stack imported by the worker subprocess only. `hibiki-asr setup`
# installs the variant-specific pins (see provision/lockfiles); this extra is
# the CPU baseline used by development and tests.
runtime = [
  "numpy>=1.26",
  "faster-whisper>=1.1,<2",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "transformers>=4.40",  # golden tests only: reference WhisperFeatureExtractor (numpy path, no torch)
]

[project.scripts]
hibiki-asr = "hibiki_asr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hibiki_asr"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# `ruff format` owns line length; long strings, URLs and divider comments are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: needs downloaded models or the full inference stack (deselect with -m 'not slow')",
]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = false  # numpy and the inference libraries are loosely typed; every other strict check stays on
warn_unused_configs = true
files = ["src/hibiki_asr"]
ignore_missing_imports = true

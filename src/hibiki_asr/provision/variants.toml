[[variant]]
id = "rocm-linux"
title = "AMD ROCm on Linux"
os = ["linux"]
gpu_vendor = "amd"
gfx = ["gfx1030", "gfx1031", "gfx1032", "gfx1035", "gfx1100", "gfx1101", "gfx1102", "gfx1103", "gfx1200", "gfx1201"]
lockfile = "cpu.txt"
wheel_archive_url = "https://github.com/OpenNMT/CTranslate2/releases/download/v4.9.0/rocm-python-wheels-Linux.zip"
wheel_archive_sha256 = "0a9ad24145fe671628d7524602241b3743a12d1487489f075f5de91f68aa2837"
wheel_version = "4.9.0"
docker = true
docker_tag = "rocm"
status = "experimental"
note = "The official CTranslate2 4.9.0 archive and SHA256 were checked. Native Linux needs ROCm 7.2 runtime libraries in the loader path and access to /dev/kfd and /dev/dri; the Docker image supplies the userspace libraries. This has not been run on an AMD GPU."
